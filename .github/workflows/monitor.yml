name: Monitor de Entradas Castelo de Soutomaior

on:
  schedule:
    # Ejecución cada 30 minutos (:17 y :47 de cada hora)
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:
    # Permite ejecutar manualmente la comprobación desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  check-tickets:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar monitor de entradas
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Guardar estado en el repositorio si hay cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add estado_anterior.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el inventario. No es necesario commit."
          else
            git commit -m "chore: actualizar estado del inventario [skip ci]"
            git pull --rebase origin main
            git push
          fi
