name: Monitor de Entradas Castelo de Soutomaior

on:
  schedule:
    # 5 ejecuciones al día en horario laboral de España:
    # 09:05, 10:05, 12:05, 14:05 y 15:05 (CET / UTC+1) -> 08, 09, 11, 13, 14 UTC
    - cron: '5 8,9,11,13,14 * * *'
  workflow_dispatch:
    # Permite ejecutar manualmente la comprobación desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  check-tickets:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar monitor de entradas
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Guardar estado en el repositorio si hay cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add estado_anterior.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el inventario. No es necesario commit."
          else
            git commit -m "chore: actualizar estado del inventario [skip ci]"
            git pull --rebase origin main
            git push
          fi
